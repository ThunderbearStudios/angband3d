steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'docker pull gcr.io/$PROJECT_ID/angband3d-cloud:latest || true'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/angband3d-cloud:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/angband3d-cloud:latest'
      - '-f'
      - 'server/Dockerfile'
      - '.'
images:
  - 'gcr.io/$PROJECT_ID/angband3d-cloud:latest'
timeout: '1200s'
options:
  machineType: 'E2_HIGHCPU_8'
