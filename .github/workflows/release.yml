name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'
      release_name:
        description: 'Release Title'
        required: false
        default: 'Angband3D Release'

permissions:
  contents: write

env:
  ANGBAND_TAG: "4.2.6"

jobs:
  build-windows:
    name: Build & Package (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ncurses
            mingw-w64-x86_64-pkgconf

      - name: Reconstruct engine fork & Build Engine
        shell: msys2 {0}
        run: |
          git clone --origin upstream --branch "${{ env.ANGBAND_TAG }}" --depth 1 \
            https://github.com/angband/angband.git engine
          cd engine
          git apply --verbose ../engine-patch/0001-bridge-frontend.patch
          cmake -G Ninja \
            -DSUPPORT_BRIDGE_FRONTEND=ON \
            -DSUPPORT_GCU_FRONTEND=ON \
            -DSUPPORT_STATIC_LINKING=ON \
            -B build .
          cmake --build build

      - name: Setup Godot & Export Templates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $godotVersion = "4.7.2-stable"
          $templateDir = "$env:APPDATA\Godot\export_templates\4.7.2.stable.mono"
          New-Item -ItemType Directory -Path $templateDir -Force | Out-Null

          Write-Host "Downloading Godot $godotVersion Mono..."
          $godotZip = "Godot_v${godotVersion}_mono_win64.zip"
          $godotUrl = "https://github.com/godotengine/godot/releases/download/${godotVersion}/${godotZip}"
          Invoke-WebRequest -Uri $godotUrl -OutFile $godotZip
          New-Item -ItemType Directory -Path "C:\Godot" -Force | Out-Null
          tar.exe -xf $godotZip -C "C:\Godot" --strip-components=1
          $godotBin = Get-ChildItem "C:\Godot" -Recurse -Filter "Godot*console.exe" | Select-Object -First 1 -ExpandProperty FullName
          Copy-Item $godotBin "C:\Godot\godot.exe" -Force
          Add-Content $env:GITHUB_PATH "C:\Godot"
          Add-Content $env:GITHUB_ENV "GODOT=C:\Godot\godot.exe"

          Write-Host "Downloading Godot $godotVersion Mono Export Templates..."
          $tpz = "Godot_v${godotVersion}_mono_export_templates.tpz"
          $tpzUrl = "https://github.com/godotengine/godot/releases/download/${godotVersion}/${tpz}"
          Invoke-WebRequest -Uri $tpzUrl -OutFile $tpz

          $templateDirs = @(
              "C:\GodotTemplates",
              "$env:APPDATA\Godot\export_templates\4.7.2.stable",
              "$env:APPDATA\Godot\export_templates\4.7.2.stable.mono",
              "$env:LOCALAPPDATA\Godot\export_templates\4.7.2.stable",
              "$env:LOCALAPPDATA\Godot\export_templates\4.7.2.stable.mono"
          )
          foreach ($td in $templateDirs) {
              New-Item -ItemType Directory -Path $td -Force | Out-Null
              tar.exe -xf $tpz -C $td --strip-components=1 templates/windows_* templates/version.txt
          }

          $winTemplate = Join-Path "C:\GodotTemplates" "windows_release_x86_64.exe"
          if (-not (Test-Path $winTemplate)) {
              throw "Verification failed: $winTemplate was not extracted properly!"
          }
          Write-Host "Godot & Export Templates configured successfully across all lookup paths: $winTemplate"

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          try {
            .\tools\package.ps1
          } catch {
            if ($env:GITHUB_STEP_SUMMARY) {
              "### Package Windows ZIP Step Failed`n`n``````n$($_ | Out-String)`n``````n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
            throw
          }

      - name: Upload Windows Package
        uses: actions/upload-artifact@v4
        with:
          name: Angband3D-Windows-x64
          path: dist/Angband3D-Windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build & Package (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libncurses-dev zip

      - name: Reconstruct engine fork & Build Engine
        run: |
          git clone --origin upstream --branch "${{ env.ANGBAND_TAG }}" --depth 1 \
            https://github.com/angband/angband.git engine
          cd engine
          git apply --verbose ../engine-patch/0001-bridge-frontend.patch
          cmake -G Ninja \
            -DSUPPORT_BRIDGE_FRONTEND=ON \
            -DSUPPORT_GCU_FRONTEND=ON \
            -B build .
          cmake --build build
          cd ..

      - name: Build C# Client (Release)
        run: dotnet build client/angband3d.csproj -c Release

      - name: Package Linux ZIP
        run: |
          mkdir -p dist/Angband3D-Linux-x64/client
          mkdir -p dist/Angband3D-Linux-x64/engine/build/game

          # Copy client files & assets
          cp -r client/Main.tscn client/project.godot client/icon.svg client/assets client/scripts dist/Angband3D-Linux-x64/client/
          if [ -d client/.godot ]; then cp -r client/.godot dist/Angband3D-Linux-x64/client/; fi

          # Copy engine binaries & gamedata
          cp engine/build/game/angband dist/Angband3D-Linux-x64/engine/build/game/
          chmod +x dist/Angband3D-Linux-x64/engine/build/game/angband
          cp -r engine/build/game/lib dist/Angband3D-Linux-x64/engine/build/game/
          mkdir -p dist/Angband3D-Linux-x64/engine/build/game/lib/save

          # Copy documentation and launchers
          cp LICENSE README.md dist/Angband3D-Linux-x64/
          cat << 'EOF' > dist/Angband3D-Linux-x64/play.sh
          #!/bin/sh
          cd "$(dirname "$0")"
          if command -v godot >/dev/null 2>&1; then
              godot --path client -- "$@"
          elif command -v godot4 >/dev/null 2>&1; then
              godot4 --path client -- "$@"
          else
              echo "Godot 4 (.NET) was not found in PATH."
              echo "Playing in text mode (GCU)..."
              ./engine/build/game/angband -mgcu "$@"
          fi
          EOF
          chmod +x dist/Angband3D-Linux-x64/play.sh

          cd dist
          zip -r Angband3D-Linux-x64.zip Angband3D-Linux-x64
          cd ..

      - name: Upload Linux Package
        uses: actions/upload-artifact@v4
        with:
          name: Angband3D-Linux-x64
          path: dist/Angband3D-Linux-x64.zip
          if-no-files-found: error

  build-android:
    name: Build & Package (Android APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Sync Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Build Android APK (Release)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/Angband3D-Android.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/Angband3D-Android.apk
          fi

      - name: Upload Android Package
        uses: actions/upload-artifact@v4
        with:
          name: Angband3D-Android-APK
          path: dist/Angband3D-Android.apk
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-packages

      - name: Prepare Assets
        run: |
          mkdir -p final-dist
          find release-packages \( -name "*.zip" -o -name "*.apk" \) -exec cp {} final-dist/ \;
          ls -la final-dist/

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "title=${{ inputs.release_name }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
            echo "title=Angband3D ${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: ${{ steps.tag_info.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: final-dist/*
