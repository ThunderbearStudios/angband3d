name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v11.5.0)'
        required: true
        default: 'v11.5.0'
      release_name:
        description: 'Release Title'
        required: false
        default: 'Angband3D Web Release'

permissions:
  contents: write

env:
  ANGBAND_TAG: "4.2.6"

jobs:
  verify-and-release:
    name: Verify Web Client & Engine Suite (Ubuntu x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libncurses-dev zip

      - name: Reconstruct engine fork & Build Engine
        run: |
          git clone --origin upstream --branch "${{ env.ANGBAND_TAG }}" --depth 1 \
            https://github.com/angband/angband.git engine
          cd engine
          git apply --verbose ../engine-patch/0001-bridge-frontend.patch
          cmake -G Ninja \
            -DSUPPORT_BRIDGE_FRONTEND=ON \
            -DSUPPORT_GCU_FRONTEND=ON \
            -B build .
          cmake --build build
          cd ..

      - name: Install Server Dependencies & Run Fast Gate
        run: |
          npm --prefix server ci
          node tools/run_tests.js --tier fast
          node tools/test_server_boot.js

      - name: Package Web & Engine Bundle
        run: |
          mkdir -p final-dist
          zip -r final-dist/Angband3D-Web-Server-Bundle.zip server/src server/public server/package.json engine-manifest.json CREDITS.md README.md

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "title=${{ inputs.release_name }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
            echo "title=Angband3D ${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: ${{ steps.tag_info.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: final-dist/*
